[package]
name = "ira-browser"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ira = { path = ".." }
ratzilla = { path = "vendor/ratzilla" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
critical-section = { version = "1", features = ["std"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
