[package]
name = "ira"
version = "0.1.21"

description = "A terminal file manager built with Ratatui and crossterm"
repository = "https://github.com/drivesensei/ira"
authors = ["vladimir.lopez"]
license = "MIT"
edition = "2021"
keywords = ["tui", "file-manager", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
dirs-next = "2.0.0"
parking_lot = "0.12.5"
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "layout-cache", "macros", "underline-color"] }
image = { version = "0.25.6", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
# Terminal image rendering (kitty/iTerm2/sixel/halfblocks). Default features
# are disabled: they pull chafa-dyn, a runtime dependency on libchafa.so that
# breaks Windows/macOS distribution of prebuilt binaries.
winapi = { version = "0.3.9", features = [
    "fileapi",
    "winbase",
    "errhandlingapi",
    "handleapi",
    "consoleapi",
    "wincon",
    "processenv",
    "winuser",
    "wingdi",
    "libloaderapi",
] }
ratatui-textarea = { version = "0.9.2", default-features = false }
serde = { version = "1", features = ["derive"] }
# Windows Terminal / VS Code settings.json (font-face lookup for icon detection).
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `ratatui-image` reaches `getrandom` through `rand`. Browsers provide secure
# randomness through Web Crypto rather than an operating-system device.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5.4.3"
ratatui = { version = "0.30.2", features = ["crossterm"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["crossterm"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDate", "NSGeometry", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSPanel",
    "NSImage",
    "NSImageView",
    "NSView",
    "NSColor",
    "NSScreen",
    "NSGraphics",
    "NSResponder",
    "NSControl",
    "NSCell",
    "NSEvent",
    "NSImageCell",
] }
