[package]
name = "ira-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dirs-next = "=2.0.0"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.8.23"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[dev-dependencies]
unicode-width = "=0.2.2"
