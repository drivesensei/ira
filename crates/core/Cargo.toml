[package]
name = "ira-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dirs-next = "=2.0.0"
parking_lot = "=0.12.5"

[dev-dependencies]
unicode-width = "=0.2.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

# D-006: source-inclusion tests exercise the existing terminal Windows host wrapper.
[target.'cfg(windows)'.dev-dependencies]
winapi = { version = "=0.3.9", features = ["fileapi", "winbase", "errhandlingapi"] }
