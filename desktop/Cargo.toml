[package]
name = "ira-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ira-core = { path = "../crates/core" }
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "0.2.2", default-features = false }
