[package]
name = "ira-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ira-core = { path = "../crates/core" }
image = { version = "=0.25.10", default-features = false }
unicode-segmentation = "=1.13.3"
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSAccessibilityConstants", "NSView", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSObject", "NSString", "NSGeometry", "NSRange"] }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Threading"] }
windows-core = "=0.61.2"
gpui = { version = "0.2.2", default-features = false }

[dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
